# cargo-deny configuration (optional / future).
#
# There is nothing to isolate any more: the column stack that this file used
# to talk about has been deleted, and the workspace is wk-material, wk-voxel
# and wk-voxel-app. The shell script that enforced the boundary is gone too.
#
# Keep this file for third-party bans / license policy later.
# CI currently runs `check bans` only to ensure the config stays valid.

[bans]
multiple-versions = "allow"
wildcards = "allow"
deny = []
