# CI for the voxel stack. Deliberately narrow: no workspace-wide clippy
# -D warnings yet.
name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  voxel:
    name: voxel stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        # rust-toolchain.toml pins 1.83.0 (+ rustfmt/clippy).
        run: rustc --version && cargo --version

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build workspace
        # The column stack used to live here and did not compile, so a
        # workspace build was never run and the breakage went unnoticed for
        # weeks. It is three crates now, so build all of it.
        run: cargo build --workspace

      - name: Test workspace
        # Not `-p … --lib` per crate: that skipped every integration test
        # under crates/wk-voxel/tests, which is where the soak and mass-audit
        # probes live.
        run: cargo test --workspace
