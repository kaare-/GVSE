[workspace]
resolver = "2"
members = [
    "crates/wk-material",
    "crates/wk-field",
    "crates/wk-world",
    "crates/wk-agents",
    "crates/wk-sim",
    "crates/wk-io",
    "crates/wk-app",
    # Greenfield 2D cellular-automata sim, isolated from the column
    # stack above. See docs/VOXEL_MIGRATION.md.
    "crates/wk-voxel",
    # Demo / renderer binary for wk-voxel. Depends on wk-voxel +
    # wk-material only; NEVER on wk-world / wk-sim / wk-agents /
    # wk-app / wk-io / wk-field.
    "crates/wk-voxel-app",
    # Muscle / Bone / Neural Test Studio — shared types + arena.
    # Same isolation as wk-voxel-app. See docs/organism/STUDIO.md.
    "crates/wk-voxel-studio",
    "crates/wk-voxel-studio-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.test]
opt-level = 2
