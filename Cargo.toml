[workspace]
resolver = "2"
members = [
    "crates/wk-material",
    "crates/wk-field",
    "crates/wk-world",
    "crates/wk-agents",
    "crates/wk-sim",
    "crates/wk-io",
    "crates/wk-app",
    # Greenfield 2D cellular-automata sim, isolated from the column
    # stack above. See docs/VOXEL_MIGRATION.md.
    "crates/wk-voxel",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.test]
opt-level = 2
