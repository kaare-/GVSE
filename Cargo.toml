[workspace]
resolver = "2"
members = [
    "crates/wk-material",
    # Active voxel stack.
    "crates/wk-voxel",
    "crates/wk-voxel-app",
    # Phase 8 ship-client spike (egui + wgpu / winit).
    "crates/wk-voxel-client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Shared third-party pins — bump here, not per-crate.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["alloc"] }
# 0.11 needs rustc > 1.83 for `query_disjoint_mut`.
hecs = "=0.10.5"
# 0.4.15 uses const f32::{min,max,abs} that need rustc > 1.83.
macroquad = "=0.4.14"
rayon = "1.10"
serde_json = "1"

# Phase 8 client (egui 0.29 / wgpu 22 / winit 0.30) — keep on rustc 1.83.
# Cargo 1.83 cannot parse edition2024 manifests; pin transitively below.
winit = "=0.30.5"
wgpu = "=22.1.0"
egui = "=0.29.1"
egui-winit = { version = "=0.29.1", default-features = false }
egui-wgpu = "=0.29.1"
pollster = "=0.3.0"
log = "=0.4.22"
env_logger = "=0.11.5"
url = "=2.5.2"
idna = "=0.5.0"
wayland-protocols = "=0.32.4"
wayland-backend = "=0.3.7"
wayland-client = "=0.31.7"
wayland-cursor = "=0.31.7"
wayland-sys = "=0.31.5"
wayland-protocols-wlr = "=0.3.4"
wayland-protocols-plasma = "=0.3.4"
hashbrown = "=0.15.2"
indexmap = "=2.6.0"
getrandom = "=0.2.15"
jobserver = "=0.1.32"
unicode-segmentation = "=1.11.0"
cc = "=1.1.31"
# ViewFrame strip compression (Phase 8 WAN path).
zstd = "0.13"

[profile.test]
opt-level = 2
