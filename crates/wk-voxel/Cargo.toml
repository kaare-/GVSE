[package]
name = "wk-voxel"
version.workspace = true
edition.workspace = true
license.workspace = true

# ISOLATION GUARDRAIL
# ------------------------------------------------------------------
# wk-voxel shares ONLY `wk-material` with column-based GVSE. It MUST NOT
# depend on wk-world, wk-field, wk-agents, wk-sim, wk-io, or wk-app.
# Enforced by: scripts/check-voxel-isolation.sh (CI).
# See docs/VOXEL_MIGRATION.md § Isolation Guardrails.

[dependencies]
wk-material = { path = "../wk-material" }
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
postcard = { workspace = true }

# Scenario ports of legacy E1/E2/E6/E8 product intents (greenfield only).
[[test]]
name = "scenarios"
path = "tests/scenarios/mod.rs"
