[package]
name = "wk-voxel-app"
version.workspace = true
edition.workspace = true
license.workspace = true

# ISOLATION GUARDRAIL
# ------------------------------------------------------------------
# Depends on wk-voxel + wk-material only. MUST NOT depend on wk-world /
# wk-field / wk-agents / wk-sim / wk-io / wk-app.
# Enforced by: scripts/check-voxel-isolation.sh (CI).
# See docs/VOXEL_MIGRATION.md § Isolation Guardrails.

[dependencies]
wk-voxel = { path = "../wk-voxel" }
wk-material = { path = "../wk-material" }
macroquad = { workspace = true }

[[bin]]
name = "wk-voxel-app"
path = "src/main.rs"
